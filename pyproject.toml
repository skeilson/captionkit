# Tool configuration only. CaptionKit is run directly (python3 main.py),
# not installed as a package.

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# E/W: style errors, F: real bugs (undefined names, unused imports),
# I: import ordering, B: common bug patterns.
select = ["E", "W", "F", "I", "B"]

[tool.bandit]
exclude_dirs = [".venv", "venv"]
